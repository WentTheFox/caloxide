name: Build and test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Verify module checksums
        run: go mod verify

      - name: Build
        run: go build -o bin/ ./cmd/...

      - name: Vet
        run: go vet -composites=false ./... # unkeyed-field style nit in inherited code

      - name: Test
        run: go test ./...
