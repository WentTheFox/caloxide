version: 2
updates:
  # Proposes bumps for the SHA-pinned actions (keeps the "# vX.Y.Z" comment in sync).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14 # do not propose a release until it has been out two weeks
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  # Keeps the Dockerfile's pinned base-image digest current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
